name: C11 builds and gameplay tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 배포 대상별로 같은 빌드·테스트·에셋 설치 과정을 수행한다.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            preset: windows-x86
          - os: windows-2025-vs2026
            preset: windows-x64
          - os: macos-15
            preset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify CMake supports Visual Studio 2026
        if: startsWith(matrix.os, 'windows-')
        shell: pwsh
        run: |
          $version = (cmake -E capabilities | ConvertFrom-Json).version
          if ($version.major -lt 4 -or ($version.major -eq 4 -and $version.minor -lt 2)) {
            throw "Visual Studio 2026 requires CMake 4.2 or newer; found $($version.string)"
          }
      - name: Configure C-only desktop build
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Gameplay, assets and source-language tests
        run: ctest --preset ${{ matrix.preset }}
      - name: Package executable and assets
        run: cmake --install build/${{ matrix.preset }} --config Release --prefix build/package/${{ matrix.preset }}
      - uses: actions/upload-artifact@v4
        with:
          name: BubbleBobble-${{ matrix.preset }}
          path: build/package/${{ matrix.preset }}/
          if-no-files-found: error

  # 그래픽 백엔드 없이 순수 C 핵심 코드에 런타임 오류 검사를 적용한다.
  portable-core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure dependency-free C11 gameplay tests
        run: cmake --preset sanitizers
      - name: Build
        run: cmake --build --preset sanitizers
      - name: Run with address and undefined-behavior sanitizers
        run: ctest --preset sanitizers
